name: run

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"   # UTC 00:30 = 台灣 08:30（開盤前只補新聞）
    - cron: "15 8 * * 1-5"   # UTC 08:15 = 台灣 16:15（收盤主更新）
    - cron: "10 13 * * 1-5"  # UTC 13:10 = 台灣 21:10（晚間補更新）

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 安裝依賴
      - name: Install deps
        run: |
          pip install -q gspread google-auth pandas requests feedparser

      # ========================
      # 指數（08:30 不跑）
      # ========================
      - name: Update TWII/TPEX sheet
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 0 * * 1-5'
        env:
          TZ: Asia/Taipei
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REGIME_LOOKBACK_DAYS: "120"
          TWII_TPEX_SHEET: "TWII/TPEX"
        run: python update_twii_tpex.py

      # ========================
      # 價格（08:30 不跑）
      # ========================
      - name: Run price updater
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 0 * * 1-5'
        env:
          TZ: Asia/Taipei
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          WS_SOURCE_SHEET: SECTOR_MAP_MASTER_ALL_PLUS
          WS_PRICES: PRICES
          LOOKBACK_CAL_DAYS: "120"
          PRICES_TAIL_DAYS: "90"
          PRICES_INCREMENTAL_BUFFER_DAYS: "7"
        run: python update_prices.py

      # ========================
      # 新聞（每天三次）
      # ========================
      - name: Run news updater
        env:
          TZ: Asia/Taipei
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WS_SOURCE_SHEET: SECTOR_MAP_MASTER_ALL_PLUS
          WS_NEWS: NEWS
          NEWS_LOOKBACK_DAYS: "7"
        run: python update_news.py
