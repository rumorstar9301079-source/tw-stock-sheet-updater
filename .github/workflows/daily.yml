name: run

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"  # 台灣時間 06:15（UTC+8）= UTC 22:15（前一日）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q yfinance gspread google-auth pandas

      - name: Run updater
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 可選：如果你分頁名稱不同才需要
          WS_WATCHLIST: WATCHLIST
          WS_PRICES: PRICES
          # 可選：想抓更長日曆天（預設 120）
          LOOKBACK_CAL_DAYS: "120"
        run: python update_prices.py

